name: Vigilant Enterprise CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        
    - name: Lint check with ruff
      run: |
        pip install ruff
        ruff check backend/
        
    - name: Security Audit (pip-audit)
      # Skip on windows/macos matrix if pip-audit has platform issues, but runs fine on all
      run: |
        pip install pip-audit
        pip-audit --desc on
        
    - name: Run Pytest Suite
      run: |
        pytest tests/ -v

  frontend-test:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        
    - name: Install dependencies
      run: npm ci
      
    - name: Strict TypeScript Compilation Check
      run: npx tsc -b
      
    - name: Production Build Compilation
      run: npm run build
