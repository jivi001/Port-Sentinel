[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilant"
version = "1.2.0"
description = "Enterprise network visibility, threat detection, and analyst approval platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vigilant Team", email = "jiviteshgd28@gmail.com"}
]
keywords = ["network", "monitoring", "security", "port-scanner", "firewall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-socketio==5.12.1",
    "python-engineio==4.11.2",
    "scapy==2.6.1",
    "psutil==6.1.1",
    "msgpack==1.1.0",
    "aiosqlite==0.20.0",
    "influxdb-client==1.48.0",
    "supabase==2.11.0",
    "requests==2.32.3",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",

    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
]

[project.scripts]
vigilant-backend = "backend.__main__:main"
sentinel-backend = "backend.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["py.typed"]
