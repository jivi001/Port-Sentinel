version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8600:8600"
    environment:
      HOST: 0.0.0.0
      PORT: 8600
      # Require custom JWT secret for session signing
      VIGILANT_JWT_SECRET: ${VIGILANT_JWT_SECRET}
      VIGILANT_CORS_ORIGINS: ${VIGILANT_CORS_ORIGINS:-"http://localhost:8080,http://127.0.0.1:8080,http://localhost:8600,http://127.0.0.1:8600,http://frontend:80"}
      
      # Database connection. Falls back to local SQLite if left empty
      DATABASE_URL: ${DATABASE_URL:-""}
      
      # Optional InfluxDB integration for time-series logging
      INFLUXDB_URL: ${INFLUXDB_URL:-"http://influxdb:8086"}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-""}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-"sentinel"}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-"traffic"}
    volumes:
      - sentinel-data:/app/data
      - sentinel-logs:/app/logs
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8600/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - sentinel-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sentinel-network

  # Enterprise-Grade PostgreSQL Backend (Optional / Production)
  db:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigilant_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vigilant}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sentinel-network

  # Time-series metrics engine (Optional)
  influxdb:
    image: influxdb:2.7
    container_name: sentinel-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-sentinel}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-traffic}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped
    networks:
      - sentinel-network

  # Grafana Dashboard (Primary Observability Platform)
  grafana:
    image: grafana/grafana:10.1.0
    container_name: sentinel-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb
    restart: unless-stopped
    networks:
      - sentinel-network

networks:
  sentinel-network:
    driver: bridge

volumes:
  sentinel-data:
    driver: local
  sentinel-logs:
    driver: local
  postgres-data:
    driver: local
  influxdb-data:
    driver: local
  grafana-data:
    driver: local
