version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8600:8600"
    environment:
      HOST: 0.0.0.0
      PORT: 8600
      SENTINEL_JWT_SECRET: "CHANGE_ME_BEFORE_DEPLOY_SUPER_SECRET"
      SENTINEL_CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:8600,http://127.0.0.1:8600,http://frontend:80"
      SQLITE_DB_PATH: data/sentinel.db
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: your_token_here
      INFLUXDB_ORG: sentinel
      INFLUXDB_BUCKET: traffic
    volumes:
      - sentinel-data:/app/data
      - sentinel-logs:/app/logs
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8600/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - sentinel-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - sentinel-network

  influxdb:
    image: influxdb:2.7
    container_name: sentinel-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=sentinel
      - DOCKER_INFLUXDB_INIT_BUCKET=traffic
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=your_token_here
    volumes:
      - influxdb-data:/var/lib/influxdb2
    restart: unless-stopped
    networks:
      - sentinel-network

networks:
  sentinel-network:
    driver: bridge

volumes:
  sentinel-data:
    driver: local
  sentinel-logs:
    driver: local
  influxdb-data:
    driver: local
